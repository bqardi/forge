name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Render.com
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Deploying to $DEPLOY_URL"
          curl -X POST "$DEPLOY_URL"

      - name: Wait for deployment to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Waiting for deployment to finish..."
          for i in {1..30}; do
            DEPLOY_STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SERVICE_ID/deploys" | jq -r '.[0].status')
            echo "Current deployment status: $DEPLOY_STATUS"
            if [ "$DEPLOY_STATUS" == "live" ]; then
              echo "Deployment successful!"
              exit 0
            elif [ "$DEPLOY_STATUS" == "failed" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            sleep 10
          done
          echo "Deployment timed out"
          exit 1

      - name: Check deployment
        run: |
          echo "Checking deployment..."
          # Replace with your deployed application's URL
          DEPLOYED_URL="https://forge-iibo.onrender.com"
          # Make an HTTP request to the deployed application
          curl -f $DEPLOYED_URL || exit 1
